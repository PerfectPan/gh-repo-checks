name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install "PyYAML>=6,<7"
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      # /bin/bash is bash 3.2 on macOS and bash 5 on Linux.
      - run: /bin/bash tests/run.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x gh-repo-checks checks/*.sh scripts/*.sh tests/*.sh
