name: Repository review checks
description: Check required repository files, the PR title, the PR description, or the pending Changesets records.
author: PerfectPan
branding:
  icon: check-square
  color: green

inputs:
  check:
    description: "Check to run: repository, pr-title, pr-body, or release-plan. pr-title and pr-body read the pull_request event payload; release-plan needs Node.js and the repository's installed dependencies."
    required: true

runs:
  using: composite
  steps:
    - name: Run ${{ inputs.check }} check
      shell: bash
      # Event fields reach the shell only through env, never through ${{ }} in
      # the script, so a crafted title or body cannot inject commands.
      env:
        CHECK: ${{ inputs.check }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        case "$CHECK" in
          repository)
            "$GITHUB_ACTION_PATH/gh-repo-checks" repository
            ;;
          pr-title)
            "$GITHUB_ACTION_PATH/gh-repo-checks" pr-title "$PR_TITLE"
            ;;
          pr-body)
            printf '%s\n' "$PR_BODY" | "$GITHUB_ACTION_PATH/gh-repo-checks" pr-body
            ;;
          release-plan)
            "$GITHUB_ACTION_PATH/gh-repo-checks" release-plan
            ;;
          *)
            printf 'repo-checks: unknown check: %s (expected repository, pr-title, pr-body, or release-plan)\n' "$CHECK" >&2
            exit 1
            ;;
        esac
